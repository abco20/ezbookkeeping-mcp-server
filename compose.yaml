services:
  ezbookkeeping-mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
      MCP_HTTP_ALLOWED_HOSTS: 127.0.0.1,localhost
      MCP_HTTP_ALLOW_UNAUTHENTICATED: "true"
      MCP_AUDIT_LOG_PATH: /app/data/audit.jsonl
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
